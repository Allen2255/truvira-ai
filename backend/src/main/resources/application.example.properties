# application.example.properties = a COPY of the settings with secrets removed.
# To run Truvira: copy this file to application.properties (same folder) and fill in the real values.
# application.properties itself is in .gitignore, so your real password never goes to GitHub.

# application.properties = Spring Boot's settings file. Spring reads it at startup.

spring.application.name=truvira-backend
server.port=8080

# ---------- DATABASE (MySQL) ----------
# JDBC URL format: jdbc:mysql://HOST:PORT/DATABASE_NAME
spring.datasource.url=jdbc:mysql://localhost:3306/truvira?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=truvira_user
spring.datasource.password=CHANGE_ME

# ---------- JPA / HIBERNATE ----------
# ddl-auto=update -> Hibernate creates/updates tables from our @Entity classes automatically.
# (Fine for learning. In real production you'd use migrations like Flyway.)
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs in the console - great for learning what happens behind the scenes!
spring.jpa.show-sql=true

# ---------- FILE UPLOAD ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Folder (relative to where the app runs) where uploaded images are saved
truvira.upload-dir=uploads

# ---------- OPTIONAL (Slices 5 and 7) ----------
# truvira.detector.url=http://localhost:8000
# truvira.frontend-origin=http://localhost:5173
# First admin password; if empty, a random one is printed once in the log
# truvira.admin.password=
