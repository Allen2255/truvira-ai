# Settings used when Truvira runs in Docker (profile "docker": SPRING_PROFILES_ACTIVE=docker).
# This file is safe to commit: it contains NO passwords.
# ${NAME:default} = read environment variable NAME; use "default" if it isn't set.
# docker-compose.yml passes these variables in from the (git-ignored) .env file.

spring.application.name=truvira-backend
server.port=8080

# ---------- DATABASE ----------
# "mysql" = the NAME of the database container. Inside Docker's network, containers find each
# other by name instead of "localhost" (localhost would mean "this same container").
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:truvira}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:truvira_user}
# No default on purpose: the app must not start without a real password.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# Quieter logs in Docker (true prints every SQL statement)
spring.jpa.show-sql=false

# ---------- FILE UPLOAD ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Absolute path INSIDE the container; docker-compose mounts a VOLUME here so evidence survives rebuilds.
truvira.upload-dir=/app/uploads

# ---------- OTHER SERVICES ----------
# "ai-service" = the name of the Python container.
truvira.detector.url=${DETECTOR_URL:http://ai-service:8000}
# The address people type in the browser (behind Caddy). Change on the server, e.g. https://truvira.duckdns.org
truvira.frontend-origin=${FRONTEND_ORIGIN:http://localhost}
