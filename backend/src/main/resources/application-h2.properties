# Extra settings used ONLY when we start with the "h2" profile:  --spring.profiles.active=h2
# They override application.properties so we can test without MySQL.
spring.datasource.url=jdbc:h2:mem:truvira;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
